name: Daily oil briefing

on:
  schedule:
    # 01:45 UTC = 05:45 Dubai, every day (weekend OPEC+ meetings and geopolitics still matter).
    - cron: "45 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate today's briefing even if it already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Write briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          BRIEFING_MODEL: ${{ vars.BRIEFING_MODEL }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: node scripts/briefing.mjs

      - name: Commit and push
        run: |
          git config user.name "oil-desk-briefing"
          git config user.email "actions@users.noreply.github.com"
          git add -A public/briefings
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily briefing $(TZ=Asia/Dubai date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
