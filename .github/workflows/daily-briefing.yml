name: Daily oil briefing

on:
  schedule:
    # 01:45 UTC = 05:45 Dubai, every day (weekend OPEC+ meetings and geopolitics still matter).
    - cron: "45 1 * * *"
    # Backups: GitHub occasionally drops scheduled runs when busy. If the briefing already exists
    # these finish in seconds without calling Claude, so they cost nothing.
    - cron: "17 3 * * *"
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate today's briefing even if it already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for Anthropic key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::Skipped: add the ANTHROPIC_API_KEY repository secret to enable the daily briefing."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: steps.key.outputs.ok == 'true'

      - name: Write briefing
        if: steps.key.outputs.ok == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          BRIEFING_MODEL: ${{ vars.BRIEFING_MODEL }}
          BRIEFING_SEARCHES: ${{ vars.BRIEFING_SEARCHES }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: node scripts/briefing.mjs

      - name: Commit and push
        if: steps.key.outputs.ok == 'true'
        run: |
          git config user.name "oil-desk-briefing"
          git config user.email "actions@users.noreply.github.com"
          git add -A public/briefings
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily briefing $(TZ=Asia/Dubai date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
